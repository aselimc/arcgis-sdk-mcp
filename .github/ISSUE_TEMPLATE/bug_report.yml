name: Bug report
description: The server crashed, would not start, or behaved differently from its documentation
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. If a tool returned a wrong or degraded answer for a
        documentation page, use the "Wrong or degraded result" form instead. For a security
        problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The command or tool call. `arcgis-sdk-mcp call <tool> '<json>'` prints exactly what
        an agent receives.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The text result or the error message. Remove anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `arcgis-sdk-mcp --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version (`node --version`) and MCP host
      placeholder: Windows 11, Node 22.15.0, Claude Code
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor
      description: >-
        Output of `arcgis-sdk-mcp doctor --product <id>` for the product involved, when the
        problem concerns fetching or configuration.
      render: text
  - type: input
    id: sources
    attributes:
      label: Configuration
      description: Any `ARCGIS_DOCS_*` variables you set (not `GITHUB_TOKEN`)
      placeholder: ARCGIS_DOCS_SOURCES=strict,+website
