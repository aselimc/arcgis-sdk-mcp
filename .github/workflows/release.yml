name: Release

# On a version tag: verify, publish to npm with provenance (trusted publishing, no token),
# publish the server metadata to the MCP Registry, then create the GitHub release from the
# changelog. docs/releasing.md describes the steps a maintainer takes before pushing the tag
# and the one-time set-up this workflow relies on.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The tag matches package.json, server.json and the changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          server=$(node -p "require('./server.json').version")
          npm_entry=$(node -p "require('./server.json').packages[0].version")
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$server" ] || [ "$tag" != "$npm_entry" ]; then
            echo "Tag $tag, package.json $pkg, server.json $server / $npm_entry do not agree" >&2
            exit 1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $tag" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Required for npm trusted publishing and provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs a recent npm; Node 24 ships one.
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # `prepack` builds and runs scripts/check-package-contents.ts.
      - run: npm publish --provenance --access public

  publish-registry:
    name: Publish to the MCP Registry
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub OIDC proves ownership of the io.github.aselimc namespace.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher (pinned and verified)
        env:
          # Raise both together; the digest is listed with the asset on the release page.
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    name: Create the GitHub release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      # Creating a release writes to the repository.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes from the changelog section of this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Lines after the heading of this version, up to the next version heading or the
          # link definitions at the end of the file.
          awk -v version="$tag" '
            index($0, "## [" version "]") == 1 { printing = 1; next }
            printing && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            printing { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
