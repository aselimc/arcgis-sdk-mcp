name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests with the coverage thresholds of vitest.config.ts. No network.
      - run: npm run test:coverage
      - name: Generated files are up to date
        run: |
          npm run gen
          git diff --exit-code -- src/registry/data docs/tools.md

  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the lowest version `engines` allows; 22.x and 24.x are the current lines.
        node: ['22.12.0', '22.x', '24.x']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds, packs the tarball and drives the packed binary over stdio and HTTP.
      - run: npm run test:e2e

  build:
    name: Build and pack check
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The binary starts and prints its version without starting the server
        run: node dist/cli/main.js --version
      # `prepack` builds again and runs scripts/check-package-contents.ts, which fails if the
      # tarball would hold anything but dist, README, LICENSE and NOTICE.
      - name: Pack check
        run: npm pack --dry-run
